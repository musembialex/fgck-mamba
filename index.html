<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGCK Mamba Church Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif}
.nav.active{background:rgba(255,255,255,.12);border-left:4px solid #f59e0b;font-weight:600}
.inp{width:100%;padding:.6rem .75rem;border:1px solid #cbd5e1;border-radius:.6rem;font-size:.85rem;background:#fff}
.inp:focus{outline:2px solid #f59e0b;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:.6rem;font-size:.75rem;font-weight:700;transition:.15s;cursor:pointer}
.btn:hover{filter:brightness(.93)}
button:focus-visible,a:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
@media print{body *{visibility:hidden}#pr,#pr *{visibility:visible}#pr button{display:none}#modal{position:static!important;background:none!important}#pr{position:absolute;left:0;top:0;width:100%;max-height:none!important;overflow:visible!important;box-shadow:none!important}}
</style>
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased">
<div id="ov" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="side(0)"></div>
<aside id="side" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white flex flex-col -translate-x-full md:translate-x-0 transition-transform duration-200 shadow-2xl">
  <div class="p-4 flex items-center gap-3 bg-slate-950 border-b border-slate-800">
    <div class="w-10 h-10 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center text-lg"><i class="fa-solid fa-cross"></i></div>
    <div><h1 class="font-bold tracking-wide text-sm text-amber-400">FGCK MAMBA</h1><p class="text-xs text-slate-400">Management System</p></div>
  </div>
  <div class="px-4 py-2 bg-slate-800/50 text-[11px] text-slate-300 truncate"><i class="fa-solid fa-location-dot text-amber-500"></i> <span data-loc></span></div>
  <nav id="nav" class="flex-1 overflow-y-auto py-2 px-2 space-y-1 text-sm"></nav>
  <div class="p-3 bg-slate-950 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between"><span>System v3.0</span><span id="badge" class="px-2 py-0.5 rounded text-[10px]"></span></div>
</aside>
<div class="md:ml-64 h-screen flex flex-col">
  <header class="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm z-20">
    <div class="flex items-center gap-3">
      <button class="md:hidden text-slate-600 text-xl p-1" onclick="side(1)" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <div><h2 class="font-bold text-base leading-tight">Church Administration Portal</h2><p class="text-xs text-slate-500" data-church></p></div>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <div class="hidden sm:block text-right"><div id="today" class="font-semibold text-slate-700"></div><div class="text-slate-400">East Africa Time</div></div>
      <button id="role" onclick="adm?lock():needAdmin(()=>{})" class="flex items-center gap-2 bg-slate-100 border px-3 py-1.5 rounded-full font-medium text-slate-700 hover:bg-slate-200"></button>
    </div>
  </header>
  <main id="main" class="flex-1 overflow-y-auto p-4 md:p-6"></main>
</div>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60"></div>
<div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 max-w-xs"></div>

<script>
const KEY='fgck_mamba_db_v3',OLD='fgck_mamba_db_v2',PWK='fgck_mamba_admin_pw';
const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>(db.settings.currency||'KES')+' '+(Number(n)||0).toLocaleString('en-KE');
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}):'—';
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const tot=a=>(a.men||0)+(a.women||0)+(a.children||0)+(a.visitors||0);
const badge=(t,c)=>`<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-${c}-100 text-${c}-700">${esc(t)}</span>`;
const F=(k,l,t='text',r=0,o=null,d=0)=>({k,l,t,r,o,d});
const DEPTS=['Worship Team','Youth Ministry','Children Ministry','Men Ministry','Women Ministry','Prayer Ministry','Media Ministry','Ushering'];

const M={
members:{l:'Members',n:'Member',t:'Member Management',s:'Register, search, update and manage member profiles.',a:'Add Member',
 f:[F('name','Full Name','text',1),F('number','Membership No. (auto if blank)'),F('gender','Gender','select',1,['Male','Female']),F('dob','Date of Birth','date'),F('phone','Phone Number','tel',1),F('email','Email','email'),F('department','Department','select',0,[...DEPTS,'General Member']),F('dateJoined','Date Joined','date',0,null,1),F('address','Residential Address')],
 c:['number','name','gender','phone','department','address']},
attendance:{l:'Attendance',n:'Attendance Record',t:'Attendance Management',s:'Record and track headcount across services.',a:'Record Attendance',sort:['date',-1],
 f:[F('service','Service Type','select',1,['Sunday Service','Midweek Service','Prayer Meeting','Youth Fellowship','Special Crusade']),F('date','Date','date',1,null,1),F('men','Men','number'),F('women','Women','number'),F('children','Children','number'),F('visitors','Visitors','number')],
 c:['date','service','men','women','children','visitors','total'],v:{total:['Total',r=>`<b class="text-emerald-700">${tot(r)}</b>`]}},
visitors:{l:'Visitors',n:'Visitor',t:'Visitor Management',s:'Track and follow up with first-time guests.',a:'Add Visitor',sort:['date',-1],
 f:[F('name','Visitor Name','text',1),F('phone','Phone Number','tel',1),F('date','Date of Visit','date',1,null,1),F('followup','Follow-up Person'),F('comments','Comments / Prayer Requests','area')],
 c:['name','phone','date','followup','comments']},
events:{l:'Events',n:'Event',t:'Church Events',s:'Plan and publish the church calendar.',a:'Create Event',sort:['date',1],
 f:[F('name','Event Name','text',1),F('category','Category','select',0,['Worship','Conference','Crusade','Prayer Meeting','Seminar']),F('date','Event Date','date',1,null,1),F('time','Event Time','time'),F('venue','Venue'),F('desc','Description','area')],
 c:['name','category','date','time','venue','desc']},
pastoral:{l:'Pastoral Care',n:'Pastoral Record',t:'Pastoral Care & Visitation',s:'Prayer requests, counselling and visitation logs.',a:'Log Pastoral Record',sort:['date',-1],
 f:[F('name','Member / Individual Name','text',1),F('type','Care Type','select',0,['Prayer Request','Counselling Session','Home Visitation','Hospital Visitation','Pastoral Appointment']),F('date','Date','date',1,null,1),F('notes','Notes / Action Details','area')],
 c:['name','type','date','notes']},
staff:{l:'Staff & Volunteers',n:'Staff Member',t:'Staff & Volunteers',s:'Church leadership, ministers, staff and ministry heads.',a:'Add Staff Member',
 f:[F('name','Full Name','text',1),F('phone','Phone Number','tel',1),F('role','Position / Role','text',1),F('department','Department')],
 c:['name','role','department','phone']},
finance:{l:'Finance',n:'Transaction',t:'Financial Management',s:'Tithes, offerings, donations, building fund and expenses.',a:'Record Transaction',sort:['date',-1],
 f:[F('type','Transaction Type','select',1,['Income','Expense']),F('category','Category','select',1,['Tithes','Sunday Offering','Thanksgiving','Building Fund','Missions & Outreach','Salaries & Allowances','Utilities & Maintenance','Equipment & Sound']),F('amount','Amount','money',1),F('method','Payment Method','select',0,['Cash','M-Pesa','Bank Transfer','Cheque']),F('date','Transaction Date','date',1,null,1),F('ref','Reference No. (M-Pesa / Receipt)')],
 c:['date','type','category','method','ref','amount'],
 x:{type:v=>badge(v,v==='Income'?'emerald':'rose'),amount:(v,r)=>`<b class="${r.type==='Income'?'text-emerald-700':'text-rose-700'}">${money(v)}</b>`},
 sm:rs=>{const i=sum(rs.filter(r=>r.type==='Income'),r=>r.amount),e=sum(rs.filter(r=>r.type!=='Income'),r=>r.amount);return `Income ${money(i)} · Expenses ${money(e)} · Net ${money(i-e)}`}},
pledges:{l:'Pledges',n:'Pledge',t:'Pledges & Donations',s:'Track development pledges and balances.',a:'Add Pledge',sort:['dueDate',1],
 f:[F('name','Donor Name','text',1),F('purpose','Purpose / Project','text',1),F('pledged','Pledged Amount','money',1),F('paid','Amount Paid','money'),F('dueDate','Target Due Date','date')],
 c:['name','purpose','pledged','paid','balance','status','dueDate'],
 v:{balance:['Balance',r=>`<b class="text-rose-700">${money(r.pledged-r.paid)}</b>`],status:['Status',r=>r.paid>=r.pledged?badge('Fulfilled','emerald'):r.paid>0?badge('Partial','amber'):badge('Pending','rose')]},
 sm:rs=>`Pledged ${money(sum(rs,r=>r.pledged))} · Paid ${money(sum(rs,r=>r.paid))} · Balance ${money(sum(rs,r=>r.pledged-r.paid))}`},
inventory:{l:'Inventory',n:'Asset',t:'Inventory & Assets',s:'Church equipment, instruments and valuations.',a:'Add Asset',
 f:[F('name','Asset / Equipment Name','text',1),F('category','Category'),F('date','Purchase Date','date'),F('value','Estimated Value','money'),F('condition','Condition','select',0,['New / Excellent','Good','Needs Repair','Faulty / Scrap'])],
 c:['name','category','date','value','condition'],sm:rs=>`Total value ${money(sum(rs,r=>r.value))}`},
communications:{l:'Communications',n:'Announcement',t:'Church Communications',s:'Log SMS, email and WhatsApp notices.',a:'Log Announcement',
 f:[F('title','Announcement Title','text',1),F('recipients','Target Group','select',0,['All Members','Youth Ministry','Men Ministry','Women Ministry','Church Leadership']),F('channel','Channel','select',0,['SMS Broadcast','Email Notice','WhatsApp Group']),F('message','Message','area',1)],
 c:['title','recipients','channel','message']}
};
const NAV=[['dashboard','Dashboard','fa-chart-line'],['members','Members','fa-users'],['attendance','Attendance','fa-clipboard-user'],['visitors','Visitors','fa-user-plus'],['departments','Departments','fa-sitemap'],['events','Church Events','fa-calendar-days'],['pastoral','Pastoral Care','fa-hands-holding-child'],['staff','Staff & Volunteers','fa-user-tie'],['finance','Financial Mgt','fa-hand-holding-dollar'],['pledges','Pledges & Donations','fa-piggy-bank'],['inventory','Inventory','fa-boxes-stacked'],['reports','Reports','fa-file-invoice-dollar'],['communications','Communications','fa-bullhorn'],['admin','Admin & DB','fa-database'],['settings','Settings','fa-sliders']];
const SETF=[['churchName','Church Name'],['town','Town'],['ward','Ward'],['county','County'],['country','Country'],['currency','Currency Code']];

const DEF={
members:[{id:'1',name:'John Mutua',number:'FGCK-MB-001',gender:'Male',dob:'1985-05-12',phone:'0712345678',email:'jmutua@gmail.com',department:'Men Ministry',dateJoined:'2020-01-15',address:'Mamba Town Center'},{id:'2',name:'Grace Nduku',number:'FGCK-MB-002',gender:'Female',dob:'1992-09-24',phone:'0723456789',email:'gnduku@gmail.com',department:'Worship Team',dateJoined:'2021-03-10',address:'Kithimani Market'}],
attendance:[{id:'1',date:'2026-11-01',service:'Sunday Service',men:320,women:410,children:112,visitors:15}],
visitors:[{id:'1',name:'Peter Kamau',phone:'0733112233',date:'2026-11-01',followup:'Elder Musyoka',comments:'Visiting from Nairobi'}],
events:[{id:'1',name:'Annual Revival Conference',category:'Conference',date:'2026-12-10',time:'09:00',venue:'Main Sanctuary',desc:'Guest speakers from Nairobi and Machakos.'}],
pastoral:[{id:'1',name:'Mary Wambua',type:'Prayer Request',date:'2026-11-02',notes:'Praying for family healing and peace.'}],
staff:[{id:'1',name:'Rev. Samuel Musyoka',phone:'0711000111',role:'Senior Pastor',department:'Pastoral Care'}],
finance:[{id:'1',type:'Income',category:'Tithes',amount:150000,method:'M-Pesa',date:'2026-11-01',ref:'QK789123'},{id:'2',type:'Income',category:'Sunday Offering',amount:45000,method:'Cash',date:'2026-11-01',ref:'CSH-001'}],
pledges:[{id:'1',name:'David Kioko',purpose:'Sanctuary Expansion',pledged:50000,paid:20000,dueDate:'2026-12-31'}],
inventory:[{id:'1',name:'Yamaha Keyboard Synthesizer',category:'Sound Equipment',date:'2022-04-10',value:120000,condition:'New / Excellent'}],
communications:[{id:'1',title:'Sunday Youth Meeting',recipients:'Youth Ministry',channel:'SMS Broadcast',message:'Youth meeting this Saturday at 2 PM.'}],
settings:{churchName:'Full Gospel Churches Of Kenya (Mamba)',town:'Mamba Town',ward:'Kithimani Ward',county:'Machakos County',country:'Kenya',currency:'KES'}};

function norm(d){const o={settings:{...DEF.settings,...(d.settings||{})}};Object.keys(M).forEach(k=>{o[k]=(Array.isArray(d[k])?d[k]:[]).filter(x=>x&&typeof x==='object').map(x=>({...x,id:String(x.id||uid()).replace(/[^\w-]/g,'')||uid()}))});return o}
function loadDB(){try{const s=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(s)return norm(JSON.parse(s))}catch(e){console.error(e)}return norm(JSON.parse(JSON.stringify(DEF)))}
let db=loadDB(),adm=false,adminTab='members',aqv='',lt;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is full or blocked. Export a backup now.','err')}}
const pw=()=>localStorage.getItem(PWK)||'admin123';

/* ---------- UI helpers ---------- */
function toast(m,t){const d=document.createElement('div');d.className=`text-white px-4 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 ${t==='err'?'bg-rose-700':'bg-emerald-700'}`;d.setAttribute('role','status');d.innerHTML=`<i class="fa-solid ${t==='err'?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${esc(m)}</span>`;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function modal(t,b,w){const m=$('modal');m.innerHTML=`<div id="pr" class="bg-white rounded-2xl w-full ${w?'max-w-2xl':'max-w-xl'} max-h-[90vh] overflow-y-auto shadow-2xl" role="dialog" aria-modal="true"><div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white rounded-t-2xl"><h3 class="font-bold text-slate-800">${t}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-lg" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="p-4">${b}</div></div>`;m.classList.remove('hidden');m.classList.add('flex');const i=m.querySelector('input,select,textarea');if(i)i.focus()}
function closeModal(){const m=$('modal');m.classList.add('hidden');m.classList.remove('flex');m.innerHTML=''}
function confirmBox(msg,fn){window._cf=fn;modal('Please confirm',`<p class="text-sm text-slate-600">${esc(msg)}</p><div class="flex justify-end gap-2 mt-5"><button class="btn border" onclick="closeModal()">Cancel</button><button class="btn bg-rose-600 text-white" onclick="closeModal();_cf()">Confirm</button></div>`)}
function side(on){$('side').classList.toggle('-translate-x-full',!on);$('ov').classList.toggle('hidden',!on)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- Admin access ---------- */
function needAdmin(fn){if(adm)return fn();window._ad=fn;modal('Administrator authorization',`<form onsubmit="unlock(event)" class="space-y-3"><p class="text-xs text-slate-500">Enter the admin password to continue. Deleting records and the Admin & DB console need this.</p><input type="password" id="apw" class="inp" placeholder="Password" required autocomplete="current-password"><div class="flex justify-end gap-2"><button type="button" class="btn border" onclick="closeModal()">Cancel</button><button class="btn bg-slate-900 text-white">Unlock</button></div></form>`)}
function unlock(e){e.preventDefault();if($('apw').value!==pw())return toast('Incorrect password','err');adm=true;closeModal();clearTimeout(lt);lt=setTimeout(lock,9e5);adminUI();renderAdmin();toast('Admin mode enabled (locks after 15 minutes)');const f=window._ad;window._ad=null;if(f)f()}
function lock(){adm=false;clearTimeout(lt);adminUI();renderAdmin();toast('Admin mode locked')}
function adminUI(){$('badge').textContent=adm?'Admin Mode':'Standard';$('badge').className='px-2 py-0.5 rounded text-[10px] font-bold '+(adm?'bg-amber-500 text-slate-900':'bg-slate-800 text-slate-300');$('role').innerHTML=`<i class="fa-solid ${adm?'fa-lock-open text-amber-600':'fa-lock text-slate-500'}"></i><span class="hidden sm:inline">${adm?'Administrator':'Staff access'}</span>`}

/* ---------- Generic table + form engine ---------- */
function lab(m,c){const f=m.f.find(x=>x.k===c);return f?f.l.replace(/ \(.*\)/,''):m.v[c][0]}
function cell(m,k,r){if(m.v&&m.v[k])return m.v[k][1](r);const f=m.f.find(x=>x.k===k),v=r[k];if(m.x&&m.x[k])return m.x[k](v,r);
 if(f.t==='money')return money(v);if(f.t==='date')return fd(v);if(f.t==='select')return v?badge(v,'blue'):'—';
 if(f.t==='area')return `<span class="block max-w-xs truncate" title="${esc(v)}">${esc(v)||'—'}</span>`;return esc(v)||'—'}
function srt(k){const s=M[k].sort,a=[...db[k]];if(s)a.sort((x,y)=>((x[s[0]]||'')>(y[s[0]]||'')?1:(x[s[0]]||'')<(y[s[0]]||'')?-1:0)*s[1]);return a}
const flt=(k,q)=>srt(k).filter(r=>!q||Object.values(r).join(' ').toLowerCase().includes(q.toLowerCase()));
function table(k,rows){const m=M[k];return `<div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-slate-100 text-slate-600 font-semibold"><tr>${m.c.map(c=>`<th class="p-3 whitespace-nowrap">${lab(m,c)}</th>`).join('')}<th class="p-3 text-center">Actions</th></tr></thead><tbody class="divide-y divide-slate-100">${rows.map(r=>`<tr class="hover:bg-slate-50">${m.c.map(c=>`<td class="p-3 align-top">${cell(m,c,r)}</td>`).join('')}<td class="p-3 text-center whitespace-nowrap"><button class="text-blue-600 hover:text-blue-800 font-medium mr-3" onclick="openForm('${k}','${r.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button><button class="text-rose-600 hover:text-rose-800 font-medium" onclick="del('${k}','${r.id}')"><i class="fa-solid fa-trash"></i> Delete</button></td></tr>`).join('')||`<tr><td colspan="${m.c.length+1}" class="p-8 text-center text-slate-400">No records found. Use the Add button to create one.</td></tr>`}</tbody></table></div>`}
function renderModule(k){const q=$('q-'+k)?$('q-'+k).value:'',rows=flt(k,q),m=M[k];$('n-'+k).textContent=`${rows.length} of ${db[k].length} records${m.sm?' · '+m.sm(rows):''}`;$('t-'+k).innerHTML=table(k,rows)}
function openForm(k,id){const m=M[k],r=id?db[k].find(x=>x.id===id):{};if(id&&!r)return;
 const fld=f=>{const v=r[f.k]??(f.d?today():(f.t==='number'||f.t==='money'?0:'')),b=`name="${f.k}" ${f.r?'required':''} class="inp"`;let i;
  if(f.t==='select'){const o=f.o.includes(v)||!v?f.o:[...f.o,v];i=`<select ${b}>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
  else if(f.t==='area')i=`<textarea ${b} rows="3">${esc(v)}</textarea>`;
  else i=`<input ${b} type="${f.t==='money'?'number':f.t}" value="${esc(v)}" ${f.t==='money'?'min="0" step="0.01"':f.t==='number'?'min="0" step="1"':f.t==='tel'?'pattern="\\+?[0-9 ]{9,15}" title="Enter a valid phone number, e.g. 0712345678"':''}>`;
  return `<div class="${f.t==='area'?'sm:col-span-2':''}"><label class="block text-xs font-semibold text-slate-600 mb-1">${f.l}${f.r?' *':''}</label>${i}</div>`};
 modal(`${id?'Edit':'Add'} ${m.n}`,`<form onsubmit="save(event,'${k}','${id||''}')" class="grid sm:grid-cols-2 gap-3">${m.f.map(fld).join('')}<div class="sm:col-span-2 flex justify-end gap-2 pt-3 border-t"><button type="button" class="btn border" onclick="closeModal()">Cancel</button><button class="btn bg-blue-900 text-white"><i class="fa-solid fa-floppy-disk"></i> ${id?'Save changes':'Save'}</button></div></form>`)}
function save(e,k,id){e.preventDefault();const m=M[k],d=new FormData(e.target),o={};
 m.f.forEach(f=>{const v=d.get(f.k)??'';o[f.k]=f.t==='number'||f.t==='money'?Math.max(0,Number(v)||0):String(v).trim()});
 if(k==='members'){if(!o.number)o.number='FGCK-MB-'+String(1+Math.max(0,...db.members.map(x=>parseInt(String(x.number||'').split('-').pop())||0))).padStart(3,'0');
  if(db.members.some(x=>x.number===o.number&&x.id!==id))return toast('That membership number is already in use','err')}
 if(k==='pledges'&&o.paid>o.pledged)return toast('Amount paid cannot be more than the pledged amount','err');
 if(id){const i=db[k].findIndex(x=>x.id===id);db[k][i]={...db[k][i],...o}}else db[k].push({id:uid(),...o});
 persist();closeModal();renderAll();toast(id?`${m.n} updated`:`${m.n} saved`)}
function del(k,id){needAdmin(()=>confirmBox('Delete this record permanently? This cannot be undone.',()=>{db[k]=db[k].filter(x=>x.id!==id);persist();renderAll();toast('Record deleted')}))}
function csv(k){const m=M[k],q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};dl(`FGCK_${k}_${today()}.csv`,'\ufeff'+[m.f.map(f=>q(f.l)),...srt(k).map(r=>m.f.map(f=>q(r[f.k])))].map(a=>a.join(',')).join('\r\n'),'text/csv')}

/* ---------- Page renderers ---------- */
function st(){const inc=sum(db.finance.filter(f=>f.type==='Income'),f=>f.amount),exp=sum(db.finance.filter(f=>f.type!=='Income'),f=>f.amount),pl=sum(db.pledges,p=>p.pledged),pd=sum(db.pledges,p=>p.paid),n=db.attendance.length;return{inc,exp,pl,pd,n,avg:n?Math.round(sum(db.attendance,tot)/n):0}}
function renderDashboard(){const s=st(),a=srt('attendance')[0];
 const card=(l,v,sub,ic,c)=>`<div class="bg-white p-5 rounded-xl border shadow-sm flex items-center justify-between gap-3"><div class="min-w-0"><p class="text-xs font-medium text-slate-500">${l}</p><h3 class="text-2xl font-bold mt-1 truncate">${v}</h3><p class="text-xs text-${c}-600 mt-1 truncate">${sub}</p></div><div class="w-12 h-12 shrink-0 rounded-xl bg-${c}-50 text-${c}-600 flex items-center justify-center text-xl"><i class="fa-solid ${ic}"></i></div></div>`;
 $('stats').innerHTML=card('Total members',db.members.length,'Active register','fa-users','blue')+card('Latest service attendance',a?tot(a):0,a?esc(a.service)+' · '+fd(a.date):'No record yet','fa-clipboard-user','emerald')+card('Total income',money(s.inc),'Net balance '+money(s.inc-s.exp),'fa-money-bill-wave','amber')+card('Pledges outstanding',money(s.pl-s.pd),db.pledges.length+' pledges tracked','fa-piggy-bank','indigo');
 $('dm').innerHTML=[...db.members].reverse().slice(0,5).map(m=>`<tr><td class="p-2 font-medium">${esc(m.name)}</td><td class="p-2 text-slate-500">${esc(m.phone)}</td><td class="p-2 text-slate-500">${esc(m.department)}</td></tr>`).join('')||'<tr><td colspan="3" class="p-4 text-center text-slate-400">No members yet</td></tr>';
 $('df').innerHTML=srt('finance').slice(0,5).map(f=>`<tr><td class="p-2 font-medium">${esc(f.category)}</td><td class="p-2">${badge(f.type,f.type==='Income'?'emerald':'rose')}</td><td class="p-2 font-bold">${money(f.amount)}</td></tr>`).join('')||'<tr><td colspan="3" class="p-4 text-center text-slate-400">No transactions yet</td></tr>'}
function quick(k){go(k);openForm(k)}
function renderDepts(){const I={'Worship Team':['fa-music','purple'],'Youth Ministry':['fa-child-reaching','blue'],'Children Ministry':['fa-face-smile','emerald'],'Men Ministry':['fa-user-tie','indigo'],'Women Ministry':['fa-person-dress','rose'],'Prayer Ministry':['fa-hands-praying','amber'],'Media Ministry':['fa-video','teal'],'Ushering':['fa-handshake','slate']};
 $('deptsGrid').innerHTML=DEPTS.map(d=>{const n=db.members.filter(m=>m.department===d).length,[ic,c]=I[d];return `<button onclick="deptFilter('${d}')" class="bg-white p-5 rounded-xl border shadow-sm flex items-center gap-4 text-left hover:border-amber-500 hover:shadow-md transition"><div class="w-12 h-12 rounded-xl bg-${c}-50 text-${c}-600 flex items-center justify-center text-xl shrink-0"><i class="fa-solid ${ic}"></i></div><div><h4 class="font-bold text-sm">${d}</h4><p class="text-xs text-slate-500">${n} registered member${n===1?'':'s'}</p></div></button>`}).join('')}
function deptFilter(n){$('q-members').value=n;go('members');renderModule('members')}
function repLines(){const s=st(),g=x=>db.members.filter(m=>m.gender===x).length;return[['Membership','fa-users','blue',[['Total members',db.members.length],['Male',g('Male')],['Female',g('Female')]]],['Attendance','fa-clipboard-user','emerald',[['Services logged',s.n],['Average attendance',s.avg],['Total visitors',sum(db.attendance,a=>a.visitors)]]],['Finance','fa-hand-holding-dollar','amber',[['Income',money(s.inc)],['Expenses',money(s.exp)],['Net balance',money(s.inc-s.exp)]]],['Pledges','fa-piggy-bank','yellow',[['Pledged',money(s.pl)],['Paid',money(s.pd)],['Outstanding',money(s.pl-s.pd)]]]]}
function renderReports(){$('repCards').innerHTML=repLines().map(([t,ic,c,ls])=>`<div class="bg-white p-5 rounded-xl border shadow-sm"><i class="fa-solid ${ic} text-3xl text-${c}-600 mb-3"></i><h3 class="font-bold text-sm">${t}</h3><ul class="text-xs text-slate-600 mt-2 space-y-1">${ls.map(l=>`<li class="flex justify-between gap-2"><span>${l[0]}</span><b>${l[1]}</b></li>`).join('')}</ul></div>`).join('')}
function printReport(){modal('Executive Summary Report',`<div class="text-xs space-y-4"><div><h2 class="text-lg font-bold" data-church>${esc(db.settings.churchName)}</h2><p class="text-slate-500">Generated ${new Date().toLocaleDateString('en-KE',{dateStyle:'full'})}</p></div>${repLines().map(([t,,,ls])=>`<div><h4 class="font-bold border-b pb-1 mb-1">${t}</h4>${ls.map(l=>`<div class="flex justify-between py-0.5"><span class="text-slate-600">${l[0]}</span><b>${l[1]}</b></div>`).join('')}</div>`).join('')}<div><h4 class="font-bold border-b pb-1 mb-1">Members by department</h4>${[...DEPTS,'General Member'].map(d=>`<div class="flex justify-between py-0.5"><span class="text-slate-600">${d}</span><b>${db.members.filter(m=>m.department===d).length}</b></div>`).join('')}</div><div class="flex justify-end gap-2 pt-3 border-t"><button class="btn border" onclick="closeModal()">Close</button><button class="btn bg-blue-900 text-white" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button></div></div>`,1)}
function renderSettingsForm(){$('setFields').innerHTML=SETF.map(([k,l])=>`<div><label class="block text-xs font-semibold text-slate-600 mb-1">${l}</label><input id="s_${k}" class="inp" value="${esc(db.settings[k])}" required></div>`).join('')}
function saveSettings(e){e.preventDefault();SETF.forEach(([k])=>db.settings[k]=$('s_'+k).value.trim());persist();renderAll();toast('Settings saved')}
function applySettings(){const s=db.settings;document.title=s.churchName+' — Management System';$$('[data-church]').forEach(e=>e.textContent=s.churchName);$$('[data-loc]').forEach(e=>e.textContent=`${s.town}, ${s.ward}, ${s.county}, ${s.country}`)}

/* ---------- Admin console ---------- */
function renderAdmin(){const el=$('adminBody');
 if(!adm){el.innerHTML=`<div class="max-w-md mx-auto bg-white p-8 rounded-2xl border shadow text-center space-y-3"><div class="w-16 h-16 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-lock"></i></div><h3 class="font-bold text-lg">Administrator access required</h3><p class="text-xs text-slate-500">Unlock to view, edit and delete any record, and to manage backups and the password.</p><button class="btn bg-slate-900 text-white" onclick="needAdmin(()=>{})">Unlock admin console</button></div>`;return}
 const m=M[adminTab];
 el.innerHTML=`<div class="bg-emerald-900 text-white p-4 rounded-xl flex items-center justify-between gap-3"><div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-2xl text-emerald-300"></i><div><h3 class="font-bold text-sm">Admin access granted</h3><p class="text-xs text-emerald-200">You can edit or delete every record in the system.</p></div></div><button class="btn bg-emerald-800 border border-emerald-600 text-white" onclick="lock()">Lock</button></div>
 ${pw()==='admin123'?'<div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-xl"><i class="fa-solid fa-triangle-exclamation"></i> You are still using the default password. Change it below before sharing this system.</div>':''}
 <div class="bg-white rounded-xl border shadow-sm"><div class="p-3 border-b flex flex-wrap gap-2">${Object.keys(M).map(k=>`<button onclick="adminTab='${k}';aqv='';renderAdmin()" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${k===adminTab?'bg-blue-900 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${M[k].l} (${db[k].length})</button>`).join('')}</div>
 <div class="p-3 flex gap-2 flex-wrap items-center justify-between"><input id="aq" class="inp sm:w-64" placeholder="Search ${m.l.toLowerCase()}..." value="${esc(aqv)}" oninput="aqv=this.value;adminRows()"><button class="btn bg-blue-900 text-white" onclick="openForm('${adminTab}')"><i class="fa-solid fa-plus"></i> Add ${m.n}</button></div><div id="arows"></div></div>
 <div class="grid md:grid-cols-2 gap-4">
  <div class="bg-white p-5 rounded-xl border shadow-sm space-y-3"><h4 class="font-bold text-sm"><i class="fa-solid fa-download text-blue-600"></i> Backup &amp; restore</h4><p class="text-xs text-slate-500">Data lives in this browser only. Download a backup regularly and keep it somewhere safe.</p><div class="flex flex-wrap gap-2"><button class="btn bg-blue-900 text-white" onclick="exportDB()">Download JSON backup</button></div><input type="file" accept=".json" onchange="imp(this)" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700"></div>
  <form onsubmit="chpw(event)" class="bg-white p-5 rounded-xl border shadow-sm space-y-3"><h4 class="font-bold text-sm"><i class="fa-solid fa-key text-amber-600"></i> Change admin password</h4><input id="np" type="password" minlength="6" required placeholder="New password (6+ characters)" class="inp" autocomplete="new-password"><button class="btn bg-slate-900 text-white">Update password</button></form></div>
 <div class="bg-rose-50 p-5 rounded-xl border border-rose-200 flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h4 class="font-bold text-rose-900 text-sm">Danger zone</h4><p class="text-xs text-rose-700">Clear everything to start fresh, or reload the sample records.</p></div><div class="flex flex-wrap gap-2"><button class="btn bg-white border border-rose-300 text-rose-700" onclick="resetData(0)">Restore sample data</button><button class="btn bg-rose-600 text-white" onclick="resetData(1)">Clear all data</button></div></div>
 <details class="bg-white rounded-xl border shadow-sm"><summary class="p-4 font-bold text-sm cursor-pointer">Raw database inspector</summary><pre class="m-4 mt-0 bg-slate-900 text-emerald-400 p-4 rounded-xl text-xs overflow-auto max-h-96">${esc(JSON.stringify(db,null,2))}</pre></details>`;
 adminRows()}
function adminRows(){if($('arows'))$('arows').innerHTML=table(adminTab,flt(adminTab,aqv))}
function exportDB(){dl(`FGCK_Mamba_Backup_${today()}.json`,JSON.stringify(db,null,2),'application/json');toast('Backup downloaded')}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0}catch{return toast('That file is not a valid backup','err')}confirmBox('Restoring will replace ALL current data with the contents of this file. Continue?',()=>{db=norm(d);persist();renderAll();renderSettingsForm();toast('Backup restored')})};r.readAsText(f);i.value=''}
function chpw(e){e.preventDefault();localStorage.setItem(PWK,$('np').value);renderAdmin();toast('Admin password updated')}
function resetData(clear){confirmBox(clear?'Delete ALL records? Export a backup first if you may need them.':'Replace all current data with the sample records?',()=>{const s=db.settings;db=norm(clear?{settings:s}:JSON.parse(JSON.stringify(DEF)));persist();renderAll();renderSettingsForm();toast(clear?'All data cleared':'Sample data restored')})}

/* ---------- Layout + routing ---------- */
function renderAll(){renderDashboard();Object.keys(M).forEach(renderModule);renderDepts();renderReports();renderAdmin();applySettings()}
function show(k){if(!$(k)||!$(k).classList.contains('page'))k='dashboard';$$('.page').forEach(s=>s.classList.add('hidden'));$(k).classList.remove('hidden');$$('.nav').forEach(a=>a.classList.toggle('active',a.dataset.k===k));side(0);$('main').scrollTop=0}
function go(k){if(location.hash==='#'+k)show(k);else location.hash=k}
const head=(t,s)=>`<div><h2 class="text-2xl font-bold">${t}</h2><p class="text-xs text-slate-500">${s}</p></div>`;
function secHTML(k){const m=M[k];return `<section id="${k}" class="page hidden space-y-4"><div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">${head(m.t,m.s)}<div class="flex gap-2 flex-wrap"><input id="q-${k}" oninput="renderModule('${k}')" placeholder="Search..." class="inp sm:w-56" aria-label="Search ${m.l}"><button class="btn bg-blue-900 text-white" onclick="openForm('${k}')"><i class="fa-solid fa-plus"></i> ${m.a}</button><button class="btn bg-white border text-slate-700" onclick="csv('${k}')" title="Export CSV"><i class="fa-solid fa-file-csv"></i> CSV</button></div></div><div class="bg-white rounded-xl border shadow-sm overflow-hidden"><div id="n-${k}" class="p-3 bg-slate-50 border-b text-xs font-semibold text-slate-600"></div><div id="t-${k}"></div></div></section>`}
function build(){
 const Q=[['members','fa-user-plus','blue','Add Member'],['attendance','fa-clipboard-list','emerald','Record Attendance'],['finance','fa-file-circle-plus','amber','Record Transaction'],['events','fa-calendar-plus','indigo','Create Event'],['visitors','fa-address-book','teal','Add Visitor']];
 const mini=(t,id,h)=>`<div class="bg-white p-5 rounded-xl border shadow-sm"><div class="flex justify-between items-center mb-3"><h4 class="font-bold text-sm">${t}</h4><a href="#${h}" class="text-xs text-blue-600 font-semibold hover:underline">View all</a></div><div class="overflow-x-auto"><table class="w-full text-xs text-left"><tbody id="${id}" class="divide-y divide-slate-100"></tbody></table></div></div>`;
 $('main').innerHTML=`
 <section id="dashboard" class="page space-y-6">
  <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6"><div class="space-y-2 text-center md:text-left"><span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-semibold">Official portal</span><h1 class="text-2xl md:text-3xl font-extrabold tracking-tight uppercase" data-church></h1><p class="text-slate-300 text-sm" data-loc></p></div><div class="w-20 h-20 rounded-full bg-white/10 border-2 border-amber-400/50 flex items-center justify-center text-amber-400 text-3xl shrink-0"><i class="fa-solid fa-church"></i></div></div>
  <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div>
  <div><h3 class="font-bold mb-3"><i class="fa-solid fa-bolt text-amber-500"></i> Quick actions</h3><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">${Q.map(([k,i,c,l])=>`<button onclick="quick('${k}')" class="bg-white p-4 rounded-xl border hover:border-amber-500 hover:shadow-md transition text-center"><i class="fa-solid ${i} text-2xl text-${c}-600 mb-2 block"></i><span class="text-xs font-semibold">${l}</span></button>`).join('')}<button onclick="go('reports')" class="bg-white p-4 rounded-xl border hover:border-amber-500 hover:shadow-md transition text-center"><i class="fa-solid fa-chart-pie text-2xl text-rose-600 mb-2 block"></i><span class="text-xs font-semibold">View Reports</span></button></div></div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">${mini('Recent members','dm','members')}${mini('Recent transactions','df','finance')}</div>
 </section>
 ${Object.keys(M).map(secHTML).join('')}
 <section id="departments" class="page hidden space-y-4">${head('Departments & Ministries','Select a ministry to see its members.')}<div id="deptsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div></section>
 <section id="reports" class="page hidden space-y-4"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">${head('Administrative Reports','Live summaries of members, attendance, finances and pledges.')}<button onclick="printReport()" class="btn bg-slate-900 text-white"><i class="fa-solid fa-print"></i> Print summary report</button></div><div id="repCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></div></section>
 <section id="admin" class="page hidden space-y-4">${head('Admin Portal & Database Management','Edit any record, back up, restore or reset the system.')}<div id="adminBody" class="space-y-4"></div></section>
 <section id="settings" class="page hidden space-y-4">${head('Church Profile & Settings','Church details used across the portal and reports.')}<form onsubmit="saveSettings(event)" class="bg-white p-5 rounded-xl border shadow-sm grid sm:grid-cols-2 lg:grid-cols-3 gap-4"><div id="setFields" class="contents"></div><div class="sm:col-span-2 lg:col-span-3"><button class="btn bg-blue-900 text-white"><i class="fa-solid fa-floppy-disk"></i> Save settings</button></div></form></section>
 <footer class="mt-8 text-center text-xs text-slate-500 py-4"><div class="font-bold text-slate-700"><i class="fa-solid fa-church text-amber-500"></i> <span data-church></span></div><div data-loc></div><div class="text-[10px] text-slate-400 mt-1">&copy; ${new Date().getFullYear()} FGCK Mamba Management System</div></footer>`;
 $('nav').innerHTML=NAV.map(([k,l,i])=>`<a href="#${k}" data-k="${k}" class="nav flex items-center gap-3 px-3 py-2.5 rounded-r-lg text-slate-200 hover:bg-slate-800 transition"><i class="fa-solid ${i} w-5 text-amber-400"></i> ${l}</a>`).join('')}

window.addEventListener('load',()=>{
 build();renderSettingsForm();adminUI();renderAll();
 $('today').textContent=new Intl.DateTimeFormat('en-KE',{dateStyle:'medium',timeZone:'Africa/Nairobi'}).format(new Date());
 window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
 $('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 show(location.hash.slice(1)||'dashboard');
});
</script>
</body>
</html>
