<script>
const KEY='fgck_mamba_db_v3',OLD='fgck_mamba_db_v2',PWK='fgck_mamba_admin_pw',UNP='fgck_unpublished';
const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const tot=a=>['men','women','children','visitors'].reduce((s,k)=>s+(Number(a[k])||0),0);

 c:['number','name','gender','phone','department','address']},

 c:['name','phone','date','followup','comments']},

 f:[F('name','Event Name','text',1),F('category','Category','select',0,['Worship','Conference','Crusade','Prayer Meeting','Seminar']),F('date','Event Date','date',1,null,1),F('time','Event Time','time'),F('venue','Venue'),F('desc','Description','area')],
 c:['name','category','date','time','venue','desc']},

 f:[F('name','Member / Individual Name','text',1),F('type','Care Type','select',0,['Prayer Request','Counselling Session','Home Visitation','Hospital Visitation','Pastoral Appointment']),F('date','Date','date',1,null,1),F('notes','Notes / Action Details','area')],
 c:['name','type','date','notes']},
staff:{l:'Staff & Volunteers',n:'Staff Member',t:'Staff & Volunteers',s:'Church leadership, ministers, staff and ministry heads.',a:'Add Staff Member',
 f:[F('name','Full Name','text',1),F('phone','Phone Number','tel',1),F('role','Position / Role','text',1),F('department','Department')],
 c:['name','role','department','phone']},
finance:{l:'Finance',n:'Transaction',t:'Financial Management',s:'Tithes, offerings, donations, building fund and expenses.',a:'Record Transaction',sort:['date',-1],
 f:[F('type','Transaction Type','select',1,['Income','Expense']),F('category','Category','select',1,['Tithes','Sunday Offering','Thanksgiving','Building Fund','Missions & Outreach','Salaries & Allowances','Utilities & Maintenance','Equipment & Sound']),F('amount','Amount','money',1),F('method','Payment Method','select',0,['Cash','M-Pesa','Bank Transfer','Cheque']),F('date','Transaction Date','date',1,null,1),F('ref','Reference No. (M-Pesa / Receipt)')],
 c:['date','type','category','method','ref','amount'],
 x:{type:v=>badge(v,v==='Income'?'emerald':'rose'),amount:(v,r)=>`<b class="${r.type==='Income'?'text-emerald-700':'text-rose-700'}">${money(v)}</b>`},
 sm:rs=>{const i=sum(rs.filter(r=>r.type==='Income'),r=>r.amount),e=sum(rs.filter(r=>r.type!=='Income'),r=>r.amount);return `Income ${money(i)} · Expenses ${money(e)} · Net ${money(i-e)}`}},
pledges:{l:'Pledges',n:'Pledge',t:'Pledges & Donations',s:'Track development pledges and balances.',a:'Add Pledge',sort:['dueDate',1],
 f:[F('name','Donor Name','text',1),F('purpose','Purpose / Project','text',1),F('pledged','Pledged Amount','money',1),F('paid','Amount Paid','money'),F('dueDate','Target Due Date','date')],
 c:['name','purpose','pledged','paid','balance','status','dueDate'],
 v:{balance:['Balance',r=>`<b class="text-rose-700">${money(r.pledged-r.paid)}</b>`],status:['Status',r=>r.paid>=r.pledged?badge('Fulfilled','emerald'):r.paid>0?badge('Partial','amber'):badge('Pending','rose')]},
 sm:rs=>`Pledged ${money(sum(rs,r=>r.pledged))} · Paid ${money(sum(rs,r=>r.paid))} · Balance ${money(sum(rs,r=>r.pledged-r.paid))}`},
inventory:{l:'Inventory',n:'Asset',t:'Inventory & Assets',s:'Church equipment, instruments and valuations.',a:'Add Asset',
 f:[F('name','Asset / Equipment Name','text',1),F('category','Category'),F('date','Purchase Date','date'),F('value','Estimated Value','money'),F('condition','Condition','select',0,['New / Excellent','Good','Needs Repair','Faulty / Scrap'])],
 c:['name','category','date','value','condition'],sm:rs=>`Total value ${money(sum(rs,r=>r.value))}`},
communications:{l:'Communications',n:'Announcement',t:'Church Communications',s:'Log SMS, email and WhatsApp notices.',a:'Log Announcement',
 f:[F('title','Announcement Title','text',1),F('recipients','Target Group','select',0,['All Members','Youth Ministry','Men Ministry','Women Ministry','Church Leadership']),F('channel','Channel','select',0,['SMS Broadcast','Email Notice','WhatsApp Group']),F('message','Message','area',1)],
 c:['title','recipients','channel','message']}
};
const NAV=[['dashboard','Dashboard','fa-chart-line'],['members','Members','fa-users'],['attendance','Attendance','fa-clipboard-user'],['visitors','Visitors','fa-user-plus'],['departments','Departments','fa-sitemap'],['events','Church Events','fa-calendar-days'],['pastoral','Pastoral Care','fa-hands-holding-child'],['staff','Staff & Volunteers','fa-user-tie'],['finance','Financial Mgt','fa-hand-holding-dollar'],['pledges','Pledges & Donations','fa-piggy-bank'],['inventory','Inventory','fa-boxes-stacked'],['reports','Reports','fa-file-invoice-dollar'],['communications','Communications','fa-bullhorn'],['admin','Admin & DB','fa-database']];
const SETF=[['churchName','Church Name'],['town','Town'],['ward','Ward'],['county','County'],['country','Country'],['currency','Currency Code']];

const DEF={
members:[{id:'1',name:'John Mutua',number:'FGCK-MB-001',gender:'Male',dob:'1985-05-12',phone:'0712345678',email:'jmutua@gmail.com',department:'Men Ministry',dateJoined:'2020-01-15',address:'Mamba Town Center'},{id:'2',name:'Grace Nduku',number:'FGCK-MB-002',gender:'Female',dob:'1992-09-24',phone:'0723456789',email:'gnduku@gmail.com',department:'Worship Team',dateJoined:'2021-03-10',address:'Kithimani Market'}],
attendance:[{id:'1',date:'2026-11-01',service:'Sunday Service',men:320,women:410,children:112,visitors:15}],
visitors:[{id:'1',name:'Peter Kamau',phone:'0733112233',date:'2026-11-01',followup:'Elder Musyoka',comments:'Visiting from Nairobi'}],

pastoral:[{id:'1',name:'Mary Wambua',type:'Prayer Request',date:'2026-11-02',notes:'Praying for family healing and peace.'}],
staff:[{id:'1',name:'Rev. Samuel Musyoka',phone:'0711000111',role:'Senior Pastor',department:'Pastoral Care'}],
finance:[{id:'1',type:'Income',category:'Tithes',amount:150000,method:'M-Pesa',date:'2026-11-01',ref:'QK789123'},{id:'2',type:'Income',category:'Sunday Offering',amount:45000,method:'Cash',date:'2026-11-01',ref:'CSH-001'}],
pledges:[{id:'1',name:'David Kioko',purpose:'Sanctuary Expansion',pledged:50000,paid:20000,dueDate:'2026-12-31'}],
inventory:[{id:'1',name:'Yamaha Keyboard Synthesizer',category:'Sound Equipment',date:'2022-04-10',value:120000,condition:'New / Excellent'}],
communications:[{id:'1',title:'Sunday Youth Meeting',recipients:'Youth Ministry',channel:'SMS Broadcast',message:'Youth meeting this Saturday at 2 PM.'}],

/* ---------- Data layer ----------
   Admin edits are saved in this browser (localStorage). Members read the newer of:
   (a) the copy saved in this browser, (b) the published data.json on the website. */
function norm(d){
 const o={settings:{...DEF.settings,...(d.settings||{})},updated:Number(d.updated)||0};
 Object.keys(M).forEach(k=>{
  const nums=M[k].f.filter(f=>f.t==='number'||f.t==='money').map(f=>f.k);
  o[k]=(Array.isArray(d[k])?d[k]:[]).filter(x=>x&&typeof x==='object').map(x=>{
   const r={...x,id:String(x.id||uid()).replace(/[^\w-]/g,'')||uid()};
   nums.forEach(n=>{r[n]=Number(r[n])||0});
   return r});
 });
 return o}
function localDB(){try{const s=localStorage.getItem(KEY)||localStorage.getItem(OLD);return s?norm(JSON.parse(s)):null}catch(e){return null}}
function best(){const l=localDB(),p=pub?norm(pub):null;return l&&p?(p.updated>l.updated?p:l):(l||p)}
function loadDB(){return best()||norm(JSON.parse(JSON.stringify(DEF)))}
function memberDB(){return best()||norm({})}
let db=norm({}),adm=false,pub=null,adminTab='members',aqv='',lt;
const PUBLIC=['dashboard',...Object.keys(M),'departments','reports'];
function persist(){if(!adm)return;db.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(UNP,'1')}catch(e){toast('Could not save: browser storage is full or blocked. Export a backup now.','err')}}
const CK='fgck_mamba_admin_cred',rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
const cred=()=>{try{return JSON.parse(localStorage.getItem(CK))||(pub&&pub.cred)||null}catch(e){return(pub&&pub.cred)||null}};
async function hsh(t,salt,sc){sc=sc||(window.crypto&&crypto.subtle?'p':'c');t=salt+'|'+t;
 if(sc==='p'){if(!(window.crypto&&crypto.subtle))throw 'https';const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(t),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);return 'p:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let a=0xdeadbeef,b=0x41c6ce57;for(let r=0;r<3000;r++)for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);return 'c:'+(a>>>0).toString(16)+(b>>>0).toString(16)}
const ck=async(t,salt,st)=>(await hsh(t,salt,st[0]))===st;
const wait=()=>{const u=+localStorage.getItem('fgck_fail_until')||0;return u>Date.now()?Math.ceil((u-Date.now())/1000):0};
function bad(m){let n=(+localStorage.getItem('fgck_fails')||0)+1;if(n>=5){localStorage.setItem('fgck_fail_until',Date.now()+60000);n=0}localStorage.setItem('fgck_fails',n);toast(m,'err')}
const needHttps=()=>toast('Admin login needs a secure (https) connection on this device','err');

/* ---------- UI helpers ---------- */
function toast(m,t){const d=document.createElement('div');d.className=`text-white px-4 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 ${t==='err'?'bg-rose-700':'bg-emerald-700'}`;d.setAttribute('role','status');d.innerHTML=`<i class="fa-solid ${t==='err'?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${esc(m)}</span>`;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function modal(t,b,w){const m=$('modal');m.innerHTML=`<div id="pr" class="bg-white rounded-2xl w-full ${w?'max-w-2xl':'max-w-xl'} max-h-[90vh] overflow-y-auto shadow-2xl" role="dialog" aria-modal="true"><div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white rounded-t-2xl"><h3 class="font-bold text-slate-800">${t}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-lg" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="p-4">${b}</div></div>`;m.classList.remove('hidden');m.classList.add('flex');const i=m.querySelector('input,select,textarea');if(i)i.focus()}
function closeModal(){const m=$('modal');m.classList.add('hidden');m.classList.remove('flex');m.innerHTML=''}
function confirmBox(msg,fn){window._cf=fn;modal('Please confirm',`<p class="text-sm text-slate-600">${esc(msg)}</p><div class="flex justify-end gap-2 mt-5"><button class="btn border" onclick="closeModal()">Cancel</button><button class="btn bg-rose-600 text-white" onclick="closeModal();_cf()">Confirm</button></div>`)}
function side(on){$('side').classList.toggle('-translate-x-full',!on);$('ov').classList.toggle('hidden',!on)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- Access control: members read-only, admin edits ---------- */
function setRole(on){adm=on;clearTimeout(lt);if(!on)closeModal();if(on)lt=setTimeout(()=>setRole(false),9e5);db=on?loadDB():memberDB();build();adminUI();renderSettingsForm();renderAll();if(!on&&location.hash==='#admin')history.replaceState(null,'','#dashboard');if(on)history.replaceState(null,'','#admin');show(on?'admin':(location.hash.slice(1)||'dashboard'))}
let _v=false;
function pwForm(note,fields,fn,btn){return `<form onsubmit="${fn}(event)" class="space-y-3"><p class="text-xs text-slate-500">${note}</p>${fields}<div class="flex justify-end gap-2 pt-1"><button type="button" class="btn border" onclick="closeModal()">Cancel</button><button class="btn bg-slate-900 text-white">${btn}</button></div></form>`}
const PI=(n,ph,ex='')=>`<input name="${n}" type="password" class="inp" placeholder="${ph}" required ${ex}>`;
const QF=()=>[0,1,2].map(i=>`<div class="grid gap-2"><input name="q${i}" class="inp" placeholder="Security question ${i+1}" required><input name="a${i}" class="inp" placeholder="Answer ${i+1}" required autocomplete="off"></div>`).join('');
async function mkQs(g){const r=[];for(let i=0;i<3;i++){const t=rnd();r.push({q:g['q'+i].value.trim(),t,a:await hsh(g['a'+i].value.trim().toLowerCase(),t)})}return r}
function needAdmin(){if(adm)return;_v=false;const c=cred();
 if(!c)return modal('Create admin password',pwForm('No admin password has been set. Only the administrator should do this. Create a password and three security questions; you will need all of them every time you log in.',PI('p1','New password (8+ characters)','minlength="8" autocomplete="new-password"')+PI('p2','Confirm password','autocomplete="new-password"')+QF(),'doSetup','Create and log in'));
 modal('Administrator login',pwForm('Step 1 of 2: enter the admin password.',PI('pw','Password','autocomplete="current-password"'),'doLogin','Continue'))}
function okLogin(m){_v=false;localStorage.setItem('fgck_fails',0);closeModal();setRole(true);toast(m)}
async function doSetup(e){e.preventDefault();if(cred())return;const g=e.target.elements;if(g.p1.value!==g.p2.value)return toast('Passwords do not match','err');try{const s=rnd();localStorage.setItem(CK,JSON.stringify({s,h:await hsh(g.p1.value,s),qs:await mkQs(g)}))}catch(x){return needHttps()}okLogin('Admin password created. Download data.json from the Admin console and upload it so the login applies on every device.')}
async function doLogin(e){e.preventDefault();const w=wait();if(w)return toast(`Too many attempts. Try again in ${w} seconds.`,'err');const c=cred();let ok;try{ok=await ck(e.target.elements.pw.value,c.s,c.h)}catch(x){return needHttps()}if(!ok)return bad('Incorrect password');_v=true;
 if(!c.qs||c.qs.length<3)return modal('Add security questions',pwForm('Your password is correct. Add three security questions to finish; they will be asked at every login.',QF(),'doUpgrade','Save and log in'));
 modal('Administrator login',pwForm('Step 2 of 2: answer your three security questions.',c.qs.map((x,i)=>`<label class="block text-xs font-semibold text-slate-700">${esc(x.q)}</label><input name="a${i}" class="inp" required autocomplete="off">`).join(''),'doQs','Log in'))}
async function doUpgrade(e){e.preventDefault();if(!_v)return needAdmin();try{localStorage.setItem(CK,JSON.stringify({...cred(),qs:await mkQs(e.target.elements)}))}catch(x){return needHttps()}okLogin('Security questions saved. Download data.json and upload it so they apply on every device.')}
async function doQs(e){e.preventDefault();if(!_v)return needAdmin();const g=e.target.elements,c=cred(),w=wait();if(w)return toast(`Too many attempts. Try again in ${w} seconds.`,'err');let ok=true;try{for(let i=0;i<3;i++)ok=(await ck(g['a'+i].value.trim().toLowerCase(),c.qs[i].t,c.qs[i].a))&&ok}catch(x){return needHttps()}if(!ok){_v=false;bad('One or more answers are incorrect. Please log in again.');return needAdmin()}okLogin('Administrator mode enabled. It locks as soon as you leave the Admin section.')}
function lock(){setRole(false);toast('Logged out of administrator mode')}
function adminUI(){$('badge').textContent=adm?'Administrator':'Member view';$('badge').className='px-2 py-0.5 rounded text-[10px] font-bold '+(adm?'bg-amber-500 text-slate-900':'bg-slate-800 text-slate-300');$('role').innerHTML=adm?`<i class="fa-solid fa-lock-open text-amber-600"></i><span class="hidden sm:inline">Administrator · Log out</span>`:`<i class="fa-solid fa-lock text-slate-500"></i><span class="hidden sm:inline">Admin login</span>`}

/* ---------- Generic table + form engine ---------- */
function lab(m,c){const f=m.f.find(x=>x.k===c);return f?f.l.replace(/ \(.*\)/,''):m.v[c][0]}
function cell(m,k,r){if(m.v&&m.v[k])return m.v[k][1](r);const f=m.f.find(x=>x.k===k),v=r[k];if(m.x&&m.x[k])return m.x[k](v,r);
 if(f.t==='money')return money(v);if(f.t==='date')return fd(v);if(f.t==='select')return v?badge(v,'blue'):'—';

  <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6"><div class="space-y-2 text-center md:text-left"><span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-semibold">Official portal</span><h1 class="text-2xl md:text-3xl font-extrabold tracking-tight uppercase" data-church></h1><p class="text-slate-300 text-sm" data-loc></p></div><div class="w-20 h-20 rounded-full bg-white/10 border-2 border-amber-400/50 flex items-center justify-center text-amber-400 text-3xl shrink-0"><i class="fa-solid fa-church"></i></div></div>
  <div id="nodata" class="hidden bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-xl">No information has been published yet. Please check back later.</div>
  <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-6">${[['Recent members','dm','members'],['Recent transactions','df','finance'],['Recent attendance','dt','attendance'],['Recent visitors','dv','visitors'],['Upcoming events','de','events'],['Latest announcements','da','communications'],['Pledges','dp','pledges'],['Pastoral care','dc','pastoral'],['Departments','dd','departments']].map(([t,i,h])=>mini(t,i,h)).join('')}</div>
 </section>
 ${Object.keys(M).map(secHTML).join('')}
 <section id="departments" class="page hidden space-y-4">${head('Departments & Ministries','Select a ministry to see its members.')}<div id="deptsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div></section>
 <section id="reports" class="page hidden space-y-4"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">${head('Administrative Reports','Live summaries of members, attendance, finances and pledges.')}<button onclick="printReport()" class="btn bg-slate-900 text-white"><i class="fa-solid fa-print"></i> Print summary report</button></div><div id="repCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></div></section>
 ${adm?`<section id="admin" class="page hidden space-y-4">${head('Admin Portal & Database Management','Edit any record, back up, restore or reset the system.')}<div id="adminBody" class="space-y-4"></div></section>
`:''}
 <footer class="mt-8 text-center text-xs text-slate-500 py-4"><div class="font-bold text-slate-700"><i class="fa-solid fa-church text-amber-500"></i> <span data-church></span></div><div data-loc></div><div class="text-[10px] text-slate-400 mt-1">&copy; ${new Date().getFullYear()} FGCK Mamba Management System</div></footer>`;
 $('nav').innerHTML=NAV.filter(([k])=>adm||PUBLIC.includes(k)||k==='admin').map(([k,l,i])=>`<a href="#${k}" data-k="${k}" class="nav flex items-center gap-3 px-3 py-2.5 rounded-r-lg text-slate-200 hover:bg-slate-800 transition"><i class="fa-solid ${i} w-5 text-amber-400"></i> ${!adm&&k==='admin'?'Admin login':l}</a>`).join('')}

/* Members: pick up newly published data.json without a manual reload */
async function refreshPub(){if(adm||!$('modal').classList.contains('hidden'))return;try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(JSON.stringify(j)===JSON.stringify(pub))return;pub=j;db=memberDB();renderAll()}catch(e){}}

window.addEventListener('load',async()=>{
 try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(r.ok)pub=await r.json()}catch(e){}
 db=memberDB();build();adminUI();renderAll();
 $('today').textContent=new Intl.DateTimeFormat('en-KE',{dateStyle:'medium',timeZone:'Africa/Nairobi'}).format(new Date());
 window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
 $('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 show(location.hash.slice(1)||'dashboard');
 setInterval(refreshPub,6e4);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshPub()});
});
</script>
</body>
</html>
